<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OSRIC 3.0 Character Sheet — background</title>
</head>
<body>
<script type="module">
  // Static import, deliberately: the SDK must already be loaded when this
  // page's load event fires, because that's when Owlbear sends its one-time
  // OBR_READY message (see the comment in index.html).
  import OBR from "./obr-sdk-2.4.0.js";

  // Runs invisibly for the whole room (Owlbear loads it from the manifest's
  // background_url). Its only job right now is registering the right-click
  // "show all data on this token" item.
  //
  // ------------------------------------------------------------------
  // SWITCH: set to false to turn the token-data inspector off. Nothing is
  // registered, but every line of this file, and debug.html, stays in place
  // for when it's needed again.
  const ENABLE_TOKEN_DEBUG_MENU = true;
  // ------------------------------------------------------------------

  const ID = "com.mogadon.osric-3-char-sheet";
  const log = (...a) => console.info("[osric-3-char-sheet]", ...a);

  // The manifest hands this page ?v=<version>. Reusing it for the pages
  // and icon opened from here means the manifest stays the single source of
  // truth for cache-busting — no extra place to keep in sync.
  const v = new URLSearchParams(location.search).get("v") || "";
  const base = new URL(".", location.href).href;
  const asset = (file, extra = "") => `${base}${file}?v=${encodeURIComponent(v)}${extra}`;

  if (!ENABLE_TOKEN_DEBUG_MENU) {
    log("token-data inspector is switched off (ENABLE_TOKEN_DEBUG_MENU = false)");
  } else {
    log(`background page loaded (v${v})`);
    OBR.onReady(() => {
      OBR.contextMenu.create({
        id: `${ID}/token-data`,
        icons: [
          {
            icon: asset("icon.svg"),
            label: "Show all data on this token (debug)",
            // Any single selected item — not just Character-layer tokens —
            // so it can be pointed at anything when something looks off.
            // Both roles named explicitly rather than relying on a default.
            filter: { max: 1, roles: ["GM", "PLAYER"] },
          },
        ],
        onClick(context) {
          const item = context.items && context.items[0];
          if (!item) return;
          OBR.modal.open({
            id: `${ID}/token-data-modal`,
            url: asset("debug.html", `&itemId=${encodeURIComponent(item.id)}`),
            width: 480,
            height: 560,
          });
        },
      });
      log("token-data inspector registered");
    });
  }
</script>
</body>
</html>
